services:
  # -------------------------------------------------------------------------
  # 1. Unified Backend & RAG Engine (FastAPI + Tree-sitter + Qdrant Cloud)
  # -------------------------------------------------------------------------
  - type: web
    name: contextfoundry-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: RAG_CLIENT_MODE
        value: direct
      - key: ALLOW_USER_REGISTRATION
        value: "false"
      - key: GEMINI_MODEL_ID
        value: gemini-3.6-flash
      - key: GEMINI_FIRST_TOKEN_TIMEOUT_SECONDS
        value: "25"
      - key: QDRANT_URL
        value: https://dcd65b46-0e99-4bc2-a06a-453a1dc0c422.eu-west-2-0.aws.cloud.qdrant.io
      - key: QDRANT_COLLECTION_NAME
        value: engineering_knowledge_base
      - key: QDRANT_KT_COLLECTION_NAME
        value: knowledge_cafe_collection
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://localhost:3000"
      - key: GEMINI_API_KEY
        sync: false
      - key: QDRANT_API_KEY
        sync: false

  # -------------------------------------------------------------------------
  # 2. Frontend Web Interface (React 18 + Vite + Tailwind SPA)
  # -------------------------------------------------------------------------
  - type: web
    name: contextfoundry-frontend
    runtime: static
    rootDir: frontend-service
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://contextfoundry-backend.onrender.com
