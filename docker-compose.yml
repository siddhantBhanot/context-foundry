version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contextfoundry-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
      - DATABASE_PATH=backend_service/data/contextfoundry.db
      - RAG_CLIENT_MODE=direct
      - VECTOR_STORE=${VECTOR_STORE:-qdrant}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK:-}
    volumes:
      - backend_data:/app/backend_service/data
    depends_on:
      - qdrant
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-service
      dockerfile: Dockerfile
    container_name: contextfoundry-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: contextfoundry-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  backend_data:
  qdrant_storage:
