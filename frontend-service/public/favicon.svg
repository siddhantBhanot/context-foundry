<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cfOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a45" />
      <stop offset="100%" stop-color="#f05a28" />
    </linearGradient>
    <linearGradient id="cfBurgundy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9e2a4b" />
      <stop offset="100%" stop-color="#6f152d" />
    </linearGradient>
    <linearGradient id="cfGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9966" />
      <stop offset="100%" stop-color="#f05a28" />
    </linearGradient>
  </defs>
  <!-- Background rounded hexagon base -->
  <rect width="64" height="64" rx="16" fill="#0f172a" />
  
  <!-- Foundry Hexagon / Cube Nodes -->
  <!-- Top Face -->
  <polygon points="32,13 49,23 32,33 15,23" fill="url(#cfGlow)" />
  
  <!-- Left Face (Burgundy accent) -->
  <polygon points="15,25 31,34 31,52 15,42" fill="url(#cfBurgundy)" />
  
  <!-- Right Face (Orange accent) -->
  <polygon points="33,34 49,25 49,42 33,52" fill="url(#cfOrange)" />
  
  <!-- Core Energy Spark -->
  <circle cx="32" cy="33" r="3.5" fill="#ffffff" />
</svg>
